    </g>
    <circle r="300" stroke-width="5" stroke-opacity="0.45"/>
    <circle r="268" stroke-width="22" stroke-dasharray="118 46" stroke-opacity="0.9"/>
    <circle r="205" stroke-width="7" stroke-dasharray="26 22" stroke-opacity="0.85"/>
    <circle r="150" stroke-width="12"/>
    <polygon points="0,-108 94,54 -94,54" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <circle cx="512" cy="512" r="140" fill="url(#core)"/>
