  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="4"/>
  <g transform="translate(512 512)" fill="none" stroke="#00e5ff" filter="url(#glow)">
